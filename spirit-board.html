<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spirit Board | Sunny Daze</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; text-align: center; padding: 40px 20px; }
        .reading-box { border: 1px solid #ec4899; padding: 30px; border-radius: 20px; background: rgba(236, 72, 153, 0.1); max-width: 500px; margin: auto; }
        .number { font-size: 4rem; font-weight: 900; color: #ec4899; text-shadow: 0 0 15px #ec4899; margin: 20px 0; }
        h2 { color: #ffd700; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="reading-box">
        <h2>Your Soul Urge</h2>
        <div id="soul-number" class="number">--</div>
        <p id="soul-msg">Calculating your vibration...</p>
        <hr style="border: 0; border-top: 1px solid #333; margin: 30px 0;">
        <h2>Life Path</h2>
        <div id="path-number" class="number">--</div>
    </div>
    <script>
        function reduce(n) {
            while (n > 9 && n !== 11 && n !== 22 && n !== 33) {
                n = n.toString().split('').reduce((a, b) => a + parseInt(b), 0);
            }
            return n;
        }
        // This simulates picking up the data—you can enhance this later!
        window.onload = () => {
            document.getElementById('soul-number').innerText = Math.floor(Math.random() * 9) + 1;
            document.getElementById('path-number').innerText = Math.floor(Math.random() * 9) + 1;
            document.getElementById('soul-msg').innerText = "Your inner self is aligned with the frequency of creation.";
        };
    </script>
</body>
</html>
