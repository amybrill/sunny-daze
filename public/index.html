<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunny Daze | Reveal Your Destiny</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle, #00001a 0%, #000000 100%); color: #ffffff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(236, 72, 153, 0.3); }
        .pink-glow { text-shadow: 0 0 10px #ec4899, 0 0 20px #ec4899; }
        .gold-text { background: linear-gradient(45deg, #ffd700, #ffae00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .crystal-ball { border: 4px solid #f9a8d4; box-shadow: 0 0 30px #ec4899; border-radius: 50%; width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; text-align: center; font-style: italic; padding: 25px; transition: all 0.5s ease; background: rgba(0,0,0,0.6); cursor: pointer; }
        .lotto-ball { width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ffffff 0%, #d1d5db 100%); color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.25rem; }
        .power-ball { background: radial-gradient(circle at 30% 30%, #ef4444 0%, #991b1b 100%); color: #fff; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">
    <div id="main-ui" class="flex flex-col items-center w-full">
        <header class="text-center my-10 max-w-2xl">
            <h1 class="text-6xl font-bold text-pink-500 pink-glow uppercase">Sunny Daze</h1>
            <p class="text-pink-200 italic mt-6 px-4">"My journey began in 1990... I've learned how to read the road map of the soul."</p>
        </header>

        <main class="w-full max-w-md space-y-8">
            <section class="flex flex-col items-center space-y-6">
                <div id="display" class="crystal-ball text-sm">The ball awaits your touch...</div>
                <div class="flex gap-2">
                    <button onclick="getFreeReading('love')" class="px-5 py-2 border border-pink-400 rounded-full text-[10px] font-bold uppercase">Love</button>
                    <button onclick="getFreeReading('wealth')" class="px-5 py-2 border border-pink-400 rounded-full text-[10px] font-bold uppercase">Wealth</button>
                    <button onclick="getFreeReading('success')" class="px-5 py-2 border border-pink-400 rounded-full text-[10px] font-bold uppercase">Success</button>
                </div>
            </section>

            <section class="glass p-8 rounded-3xl space-y-4">
                <input type="text" id="userName" placeholder="Full Birth Name" class="w-full bg-black/60 border border-pink-500 p-4 rounded-xl text-white">
                <input type="date" id="birthDate" class="w-full bg-black/60 border border-pink-500 p-4 rounded-xl text-white">
                <div class="space-y-3">
                    <button onclick="startCheckout(99, 'Powerball Lotto Generator')" class="w-full bg-indigo-700 py-4 rounded-2xl font-bold flex justify-between px-6"><span>Lotto Picks</span><span>$0.99</span></button>
                    <button onclick="startCheckout(222, 'Soul Reading')" class="w-full bg-pink-600 py-4 rounded-2xl font-bold flex justify-between px-6"><span>Soul Reading</span><span>$2.22</span></button>
                    <button onclick="startCheckout(444, 'Timeline Transit')" class="w-full bg-purple-700 py-4 rounded-2xl font-bold flex justify-between px-6"><span>Timeline Transit</span><span>$4.44</span></button>
                </div>
            </section>
        </main>
    </div>

    <script>
        function getFreeReading(type) {
            const readings = {
                love: ["Love is coming.", "Trust your heart."],
                wealth: ["Abundance flows.", "New doors open."],
                success: ["Victory is near.", "Stay focused."]
            };
            document.getElementById('display').innerText = readings[type][Math.floor(Math.random() * readings[type].length)];
        }

        async function startCheckout(amount, service) {
            const name = document.getElementById('userName').value;
            const bday = document.getElementById('birthDate').value;
            if(!name || !bday) return alert("Please fill in your name and birthdate.");

            try {
                const res = await fetch('/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount, name: service, customerName: name, birthdate: bday, returnType: 'spirit-board' })
                });
                
                if (!res.ok) {
                    const errorData = await res.json();
                    throw new Error(errorData.error || "Server Error");
                }

                const data = await res.json();
                if (data.url) {
                    localStorage.setItem('userData', JSON.stringify({ name, bday, amount }));
                    window.location.href = data.url;
                } else {
                    alert("No checkout URL received from server.");
                }
            } catch (err) {
                console.error(err);
                alert("Stripe Connection Error: " + err.message);
            }
        }
    </script>
</body>
</html>
