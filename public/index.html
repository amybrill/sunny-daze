<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunny Daze | Reveal Your Destiny</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle, #00001a 0%, #000000 100%); color: #ffffff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(236, 72, 153, 0.3); }
        .pink-glow { text-shadow: 0 0 10px #ec4899, 0 0 20px #ec4899; }
        .gold-text { background: linear-gradient(45deg, #ffd700, #ffae00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .crystal-ball { border: 4px solid #f9a8d4; box-shadow: 0 0 30px #ec4899; border-radius: 50%; width: 220px; height: 220px; display: flex; align-items: center; justify-content: center; text-align: center; font-style: italic; padding: 25px; transition: all 0.5s ease; background: rgba(0,0,0,0.5); }
        .lotto-ball { width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ffffff 0%, #d1d5db 100%); color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.25rem; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">
    <div id="main-ui" class="flex flex-col items-center w-full">
        <header class="text-center my-10 max-w-2xl">
            <h1 class="text-6xl font-bold text-pink-500 tracking-tighter pink-glow uppercase">Sunny Daze</h1>
            <p class="text-pink-200 italic mt-6 text-lg leading-relaxed px-4">
                "My journey began in 1990. Over the years life has taught me the power of numbers and the language of the stars."
            </p>
        </header>

        <main class="w-full max-w-md space-y-6">
            <section class="glass p-8 rounded-3xl space-y-4 border-pink-500/30">
                <input type="text" id="userName" placeholder="Full Birth Name" class="w-full bg-black/60 border border-pink-500 p-4 rounded-xl outline-none text-white">
                <input type="email" id="userEmail" placeholder="Email Address" class="w-full bg-black/60 border border-pink-500 p-4 rounded-xl outline-none text-white">
                <input type="date" id="birthDate" class="w-full bg-black/60 border border-pink-500 p-4 rounded-xl outline-none text-white">
                
                <div class="grid grid-cols-2 gap-2">
                    <input type="time" id="birthTime" class="bg-black/60 border border-pink-500/50 p-4 rounded-xl outline-none text-white text-sm">
                    <input type="text" id="birthCity" placeholder="City of Birth" class="bg-black/60 border border-pink-500/50 p-4 rounded-xl outline-none text-white text-sm">
                </div>

                <div class="space-y-3 pt-4">
                    <button onclick="startCheckout(99, 'Lotto Picks')" class="w-full bg-indigo-700 py-4 rounded-2xl font-bold uppercase flex justify-between px-6 hover:bg-indigo-600 transition"><span>Lotto Picks</span><span>$0.99</span></button>
                    <button onclick="startCheckout(222, 'Soul & Life Path')" class="w-full bg-pink-600 py-4 rounded-2xl font-bold uppercase flex justify-between px-6 hover:bg-pink-500 transition"><span>Soul Reading</span><span>$2.22</span></button>
                    <button onclick="startCheckout(777, 'Cosmic Trinity')" class="w-full border-2 border-yellow-500 bg-black/40 py-4 rounded-2xl font-bold uppercase flex justify-between px-6 hover:bg-yellow-500/20 transition"><span class="gold-text">Cosmic Trinity</span><span class="gold-text">$7.77</span></button>
                    <button onclick="startCheckout(444, 'Timeline Transit')" class="w-full bg-purple-700 py-4 rounded-2xl font-bold uppercase flex justify-between px-6 hover:bg-purple-600 transition"><span>Timeline Transit</span><span>$4.44</span></button>
                </div>
            </section>
        </main>
    </div>

    <script>
        async function startCheckout(amount, service) {
            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value; // GRABBING EMAIL
            const bday = document.getElementById('birthDate').value;
            const btime = document.getElementById('birthTime').value;
            const bcity = document.getElementById('birthCity').value;

            if(!name || !bday || !email) return alert("Please fill in Name, Birthday, and Email.");
            
            localStorage.setItem('userData', JSON.stringify({ name, email, bday, btime, bcity, amount }));
            
            const res = await fetch('/create-checkout-session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    amount, 
                    name: service, 
                    customerName: name, 
                    email: email, // SENDING EMAIL
                    birthdate: bday,
                    birthplace: bcity,
                    birthtime: btime
                })
            });
            const data = await res.json();
            if (data.url) window.location.href = data.url;
        }
    </script>
</body>
</html>
