<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunny Daze 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: #ff007f !important; 
            background: radial-gradient(circle, #ff007f 0%, #cc0066 100%) !important; 
            color: #ffffff !important; 
            min-height: 100vh; margin: 0; display: flex; flex-direction: column; align-items: center;
        }
        .neon-yellow-text {
            color: #ccff00 !important;
            text-shadow: 0 0 15px #ccff00, 0 0 30px #ccff00 !important;
        }
        .neon-yellow-title {
            color: #ccff00 !important;
            text-shadow: 0 0 15px #ccff00, 0 0 30px #ccff00 !important;
            font-weight: 900 !important; font-size: 4rem !important; text-transform: uppercase;
        }
        .neon-purple-ball { 
            border: 6px solid #e0b0ff !important; 
            box-shadow: 0 0 50px #9d00ff !important; 
            border-radius: 50% !important; width: 260px; height: 260px; 
            display: flex; align-items: center; justify-content: center; 
            text-align: center; font-style: italic; padding: 25px; 
            background: rgba(157, 0, 255, 0.7) !important; color: white !important; font-weight: bold;
        }
        .btn-purple-neon {
            background-color: #9d00ff !important;
            border: 2px solid #e0b0ff !important;
            box-shadow: 0 0 15px #9d00ff !important;
            color: white !important;
            font-weight: bold;
            text-transform: uppercase;
        }
        /* Dark Purple background for boxes as requested */
        .dark-purple-box {
            background-color: #2e004f !important;
            border: 2px solid rgba(255, 255, 255, 0.2) !important;
        }
        /* Neon Yellow for consonants and vowels (text) and Neon Pink for numbers */
        .btn-pink-paid {
            background-color: #ff00ff !important; 
            border: 2px solid #ffb3ff !important;
            box-shadow: 0 0 20px #ff00ff !important; 
            color: #ccff00 !important; /* Consonants/Vowels Neon Yellow */
            font-weight: bold;
        }
        .price-text {
            color: #ff00ff !important; /* Numbers Neon Pink */
            text-shadow: 0 0 10px #ff00ff;
        }
        input {
            color: #ccff00 !important; /* Consonants/Vowels Neon Yellow */
        }
        input::placeholder {
            color: rgba(204, 255, 0, 0.6) !important;
        }
    </style>
</head>
<body class="p-4">
    <div class="flex flex-col items-center w-full max-w-2xl text-center">
        <header class="my-10">
            <h1 class="neon-yellow-title">Sunny Daze</h1>
            <p class="text-white italic mt-6 text-xl leading-relaxed px-4">
                "My journey began in 1990 when I moved 1100 miles with a newborn, a baby, a toddler, and a six year old. I learned to read the numbers and now I'd like to share them with you."
            </p>
        </header>

        <section class="flex flex-col items-center mb-6">
            <div id="display" class="neon-purple-ball text-sm">The ball awaits...</div>
            
            <div class="flex gap-3 mt-6">
                <button onclick="getFree('Wealth')" class="btn-purple-neon px-6 py-2 rounded-full text-xs">Wealth</button>
                <button onclick="getFree('Career')" class="btn-purple-neon px-6 py-2 rounded-full text-xs">Career</button>
                <button onclick="getFree('Love')" class="btn-purple-neon px-6 py-2 rounded-full text-xs">Love</button>
            </div>
            <p class="neon-yellow-text font-bold uppercase tracking-widest mt-4 text-sm">free daily fortune</p>
        </section>

        <section class="dark-purple-box p-8 rounded-3xl space-y-4 w-full max-w-md">
            <input type="text" id="userName" placeholder="Birth Name" class="w-full bg-black/40 border border-white/40 p-4 rounded-xl outline-none">
            <input type="date" id="birthDate" class="w-full bg-black/40 border border-white/40 p-4 rounded-xl outline-none">
            
            <div class="space-y-4 pt-4">
                <button onclick="buy(99, 'Powerball Picks')" class="w-full btn-pink-paid py-4 rounded-2xl flex justify-between px-6 uppercase">
                    <span>Powerball Picks</span><span class="price-text">$0.99</span>
                </button>
                <button onclick="buy(222, 'Soul/life path reading')" class="w-full btn-pink-paid py-4 rounded-2xl flex justify-between px-6 uppercase">
                    <span>Soul/life path reading</span><span class="price-text">$2.22</span>
                </button>
                <button onclick="buy(444, 'Timeline Transit')" class="w-full btn-pink-paid py-4 rounded-2xl flex justify-between px-6 uppercase">
                    <span>Timeline Transit</span><span class="price-text">$4.44</span>
                </button>
                <button onclick="buy(777, 'Cosmic Trinity')" class="w-full btn-pink-paid py-4 rounded-2xl flex justify-between px-6 uppercase">
                    <span>Cosmic Trinity</span><span class="price-text">$7.77</span>
                </button>
            </div>
        </section>

        <footer class="mt-20 pb-10">
            <p class="text-white text-xs opacity-80 italic">"For entertainment purposes only."</p>
        </footer>
    </div>

    <script>
        function getFree(type) {
            const msgs = {
                'Wealth': 'Abundance is finding its way to you.',
                'Career': 'New opportunities are manifesting.',
                'Love': 'A deep connection is on the horizon.'
            };
            document.getElementById('display').innerText = msgs[type];
        }

        async function buy(amt, srv) {
            const name = document.getElementById('userName').value;
            const bday = document.getElementById('birthDate').value;
            if(!name || !bday) return alert("Details needed.");
            const res = await fetch('/create-checkout-session', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ amount: amt, name: srv, customerName: name, birthdate: bday })
            });
            const data = await res.json();
            if(data.url) window.location.href = data.url;
        }
    </script>
</body>
</html>
