<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunny Daze 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: #ff007f !important; 
            background: radial-gradient(circle, #ff007f 0%, #cc0066 100%) !important; 
            color: #ffffff !important; 
            min-height: 100vh; margin: 0; display: flex; flex-direction: column; align-items: center;
        }
        .neon-yellow-title {
            color: #ccff00 !important;
            text-shadow: 0 0 15px #ccff00, 0 0 30px #ccff00 !important;
            font-weight: 900 !important; font-size: 4rem !important; text-transform: uppercase;
        }
        .neon-purple-ball { 
            border: 6px solid #e0b0ff !important; 
            box-shadow: 0 0 50px #9d00ff !important; 
            border-radius: 50% !important; width: 260px; height: 260px; 
            display: flex; align-items: center; justify-content: center; 
            text-align: center; font-style: italic; padding: 25px; 
            background: rgba(157, 0, 255, 0.7) !important; color: white !important; font-weight: bold;
        }
        .btn-pink-paid {
            background-color: #ff00ff !important; border: 2px solid #ffb3ff !important;
            box-shadow: 0 0 20px #ff00ff !important; color: white !important; font-weight: bold;
        }
    </style>
</head>
<body class="p-4">
    <div class="flex flex-col items-center w-full max-w-2xl text-center">
        <header class="my-10">
            <h1 class="neon-yellow-title">Sunny Daze</h1>
            <p class="text-white italic mt-6 text-xl leading-relaxed px-4">
                "My journey began in 1990 when I moved 1100 miles with a newborn, a baby, a toddler, and a six year old. I learned to read the numbers and now I'd like to share them with you."
            </p>
        </header>

        <section class="flex flex-col items-center mb-10">
            <div id="display" class="neon-purple-ball text-sm">The ball awaits...</div>
        </section>

        <section class="bg-black/30 p-8 rounded-3xl space-y-4 w-full max-w-md">
            <input type="text" id="userName" placeholder="Birth Name" class="w-full bg-black/40 border border-white/40 p-4 rounded-xl text-white outline-none">
            <input type="date" id="birthDate" class="w-full bg-black/40 border border-white/40 p-4 rounded-xl text-white outline-none">
            <div class="space-y-4 pt-4">
                <button onclick="buy(99, 'Lotto')" class="w-full btn-pink-paid py-4 rounded-2xl flex justify-between px-6 uppercase"><span>Lotto Picks</span><span>$0.99</span></button>
                <button onclick="buy(222, 'Soul')" class="w-full btn-pink-paid py-4 rounded-2xl flex justify-between px-6 uppercase"><span>Soul & Life Path</span><span>$2.22</span></button>
            </div>
        </section>
    </div>
    <script>
        async function buy(amt, srv) {
            const name = document.getElementById('userName').value;
            const bday = document.getElementById('birthDate').value;
            if(!name || !bday) return alert("Details needed.");
            const res = await fetch('/create-checkout-session', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ amount: amt, name: srv, customerName: name, birthdate: bday })
            });
            const data = await res.json();
            if(data.url) window.location.href = data.url;
        }
    </script>
</body>
</html>
