<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | Sunny Daze</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: url('ball.png') no-repeat center center fixed; 
            background-size: cover;
            background-color: #000;
            color: #ffffff; 
            font-family: 'Inter', sans-serif; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .page-overlay {
            background: rgba(0, 0, 0, 0.85);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .glass { 
            background: rgba(0, 0, 0, 0.7); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(236, 72, 153, 0.3); 
            padding: 40px;
            border-radius: 24px;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.2);
        }
        .pink-glow { text-shadow: 0 0 10px #ec4899, 0 0 20px #ec4899; }
        .gold-text { background: linear-gradient(45deg, #ffd700, #ffae00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            border-radius: 50px;
            background: rgba(236, 72, 153, 0.2);
            border: 1px solid #ec4899;
            color: #ec4899;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            background: #ec4899;
            color: #fff;
            box-shadow: 0 0 15px #ec4899;
        }
    </style>
</head>
<body>
    <div class="page-overlay">
        <div class="glass">
            <h1 class="text-4xl font-bold text-pink-500 pink-glow uppercase tracking-tighter mb-6">Payment Received</h1>
            <div class="space-y-4">
                <p class="text-lg gold-text font-bold italic">Thank you for trusting the numbers.</p>
                <p class="text-pink-100 leading-relaxed">
                    Your personalized reading is being decoded and prepared right now. 
                    <br><br>
                    Please check your inbox—you will receive your full alignment details **within 24 hours** at the email address provided.
                </p>
            </div>
            
            <a href="index.html" class="back-btn">Return to Site</a>
        </div>
    </div>
</body>
</html>
