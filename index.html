<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunny Daze Readings</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; background: #fffcf0; padding: 40px; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 2px solid #ffd700; }
        h1 { color: #d4af37; margin-bottom: 10px; }
        .card { border: 1px solid #f0f0f0; padding: 20px; margin: 15px 0; border-radius: 12px; transition: 0.3s; background: #fff; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        button { background: #ffcc00; border: none; padding: 12px 30px; cursor: pointer; font-weight: bold; border-radius: 50px; font-size: 16px; width: 100%; transition: 0.2s; }
        button:hover { background: #f0c000; scale: 1.05; }
        .cosmic { border: 2px solid #9c27b0; background: #fbf5ff; }
        .price { font-size: 1.2em; font-weight: bold; color: #555; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>☀️ Sunny Daze ☀️</h1>
        <p>Select your path to clarity</p>

        <div class="card">
            <h3>Quick Spark</h3>
            <div class="price">$0.99</div>
            <button onclick="pay(0.99, 'Quick Spark')">Purchase Reading</button>
        </div>

        <div class="card">
            <h3>Pathfinder</h3>
            <div class="price">$4.44</div>
            <button onclick="pay(4.44, 'Pathfinder')">Purchase Reading</button>
        </div>

        <div class="card cosmic">
            <h3>✨ Cosmic Trinity ✨</h3>
            <div class="price">$7.77</div>
            <button onclick="pay(7.77, 'Cosmic Trinity')">Purchase Reading</button>
        </div>
    </div>

    <script>
        async function pay(amount, itemName) {
            try {
                const response = await fetch('/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount, itemName })
                });
                
                const session = await response.json();
                
                if (session.url) {
                    // This sends them to the secure Stripe page
                    window.location.href = session.url;
                } else {
                    alert("Unable to reach the checkout. Please try again.");
                }
            } catch (err) {
                console.error("Payment Error:", err);
                alert("Connection error. Please check your internet.");
            }
        }
    </script>
</body>
</html>
