<script>
    // Ensure this URL is exactly what you see in your Railway Dashboard
    const RAILWAY_URL = 'https://sunny-daze-production.up.railway.app';

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('unlocked') === 'true') { unlockContent(); }
    };

    function unlockContent() {
        document.getElementById('locked-section').classList.add('hidden');
        document.getElementById('premium-content').classList.remove('hidden');
        document.getElementById('display').innerHTML = "<span class='gold-text'>Manifestation Field Unlocked.</span>";
    }

    function getFreeFortune(type) {
        const name = document.getElementById('userName').value;
        if(!name) return alert("Please fill in your Alignment Details at the top first.");
        document.getElementById('display').innerHTML = `<span class='pink-glow'>${type} Reading for ${name}:</span><br>The numbers are shifting in your favor.`;
    }

    async function pay(serviceName, priceId) {
        const email = document.getElementById('userEmail').value;
        const name = document.getElementById('userName').value;

        if(!email) return alert("Email required in Alignment Details.");

        // Visual feedback so the user knows something is happening
        const display = document.getElementById('display');
        display.innerHTML = "Connecting to Cosmic Servers...";

        try {
            const response = await fetch(`${RAILWAY_URL}/create-checkout-session`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    priceId: priceId, 
                    userEmail: email, 
                    userName: name,
                    serviceName: serviceName 
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || `Server Error: ${response.status}`);
            }

            const session = await response.json();
            if(session.url) {
                window.location.href = session.url;
            } else {
                throw new Error("No checkout URL received.");
            }
        } catch (err) {
            console.error("Payment Error:", err);
            display.innerHTML = "Connection Interrupted.";
            alert("Payment failed: " + err.message);
        }
    }
</script>
